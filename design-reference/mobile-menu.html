<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile menu — Syahreza Satria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEC}
a{color:#111111;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #EFEFEC; color: #111111; font-family: 'DM Sans', system-ui, sans-serif;">

<header style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;">
<a href="#" style="font: 800 18px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em;">SYAHREZA®</a>
<button type="button" onClick="{{toggle}}" aria-expanded="false" style="font: 600 15px 'DM Sans', sans-serif; background: #111111; color: #EFEFEC; border: 0; border-radius: 999px; padding: 0 20px; min-height: 44px; cursor: pointer;">Menu</button>
</header>
<div style="padding: 40px 20px 0; display: flex; flex-direction: column; gap: 20px;">
<h1 style="margin: 0; font: 800 76px / 0.86 'Bricolage Grotesque', sans-serif; letter-spacing: -0.05em;">Code<span style="color: {{accent}};">×</span><br>Creative.</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; border-top: 2px solid #111111; padding-top: 18px;">I'm <strong>Syahreza Satria</strong>, a hybrid developer &amp; creative specialist from Bandung.</p>
<a href="#" style="font: 700 17px 'Bricolage Grotesque', sans-serif; background: #111111; color: #EFEFEC; padding: 0 22px; min-height: 52px; border-radius: 999px; display: inline-flex; align-items: center; align-self: flex-start;">See the work ↓</a>
<div style="aspect-ratio: 4 / 3; border-radius: 20px; background: #111111; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #B5B5AF;">[FEATURED PROJECT]</div>
</div>

<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<div role="dialog" aria-modal="true" aria-label="Site menu" style="position: absolute; inset: 0; background: #111111; color: #EFEFEC; display: flex; flex-direction: column; padding: 16px 20px 28px; box-sizing: border-box;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="font: 800 18px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em;">SYAHREZA®</span>
<button type="button" onClick="{{toggle}}" aria-expanded="true" style="font: 600 15px 'DM Sans', sans-serif; background: {{accent}}; color: #111111; border: 0; border-radius: 999px; padding: 0 20px; min-height: 44px; cursor: pointer;">Close</button>
</div>
<nav aria-label="Main" style="display: flex; flex-direction: column; margin-top: 40px;">
<sc-for list="{{links}}" as="l" hint-placeholder-count="7">
<a href="#" style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #33332F; color: #EFEFEC;">
<span style="font: 800 40px / 1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.03em;">{{l.name}}</span>
<span style="font-size: 13px; color: #B5B5AF;">{{l.no}}</span>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; gap: 10px;">
<a href="#" style="flex: 1; background: {{accent}}; color: #111111; font-weight: 600; font-size: 15px; min-height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center;">Download CV</a>
<button type="button" style="flex: 0 0 auto; background: none; border: 1.5px solid #EFEFEC; color: #EFEFEC; font: 600 15px 'DM Sans', sans-serif; border-radius: 999px; padding: 0 18px; min-height: 48px; cursor: pointer;">EN / ID</button>
</div>
<nav aria-label="Social" style="display: flex; justify-content: space-between; font-size: 14px;">
<a href="https://github.com/syahreza-satria" style="color: #D6D6D0;">GitHub</a>
<a href="https://linkedin.com/in/syahreza-satria" style="color: #D6D6D0;">LinkedIn</a>
<a href="https://youtube.com/@syahrezasatria" style="color: #D6D6D0;">YouTube</a>
<a href="https://instagram.com/syahreza.satria" style="color: #D6D6D0;">Instagram</a>
</nav>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A1F","options":["#FF5A1F","#C6F432","#7C9CFF","#FFC21A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { open: true }; }
renderVals() {
return {
accent: this.props.accent ?? '#FF5A1F',
open: this.state.open,
toggle: () => this.setState({ open: !this.state.open }),
links: ['Home', 'Work', 'About', 'Achievement', 'Gears', 'Guestbook', 'Contact'].map((name, i) => ({ name, no: '0' + (i + 1) }))
};
}
}
</script>
</body>
</html>
